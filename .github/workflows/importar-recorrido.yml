name: Importar ZIP de recorrido SLAM

on:
  push:
    branches: [main]
    paths:
      - 'importar/*.zip'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publicar-recorridos-slam
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Importar y validar solo los ZIP nuevos o actualizados
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            shopt -s nullglob
            archivos=(importar/*.zip)
          else
            # Evitar reprocesar los ZIP anteriores cada vez que se publica
            # una actualización del mismo recorrido.
            mapfile -t archivos < <(git diff-tree --root --no-commit-id --name-only --diff-filter=AM -r "$GITHUB_SHA" -- 'importar/*.zip')
          fi
          if [ "${#archivos[@]}" -eq 0 ]; then
            # La limpieza del repositorio puede eliminar antiguos ZIP.
            # En ese caso no hay nada que publicar; esto no es un error.
            echo "No hay ZIP añadidos o actualizados en este commit."
            exit 0
          fi
          python scripts/importar_recorrido.py --update "${archivos[@]}"

      - name: Guardar archivos publicados en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recorridos/
          if git diff --cached --quiet; then
            echo "Sin archivos nuevos"
          else
            git commit -m "Publicar recorridos SLAM desde ZIP validado"
            git push origin HEAD:main
          fi

      - name: Solicitar reconstrucción de GitHub Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output /tmp/pages-rebuild.json --write-out '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds" || true)
          echo "Respuesta de reconstrucción de Pages: $status"
          cat /tmp/pages-rebuild.json || true

      - name: Resumen
        shell: bash
        run: |
          echo "## Importación de SLAM completada" >> "$GITHUB_STEP_SUMMARY"
          echo "Ver el paso de importación para identificar el ZIP nuevo o actualizado." >> "$GITHUB_STEP_SUMMARY"
          echo "Los archivos están en recorridos/ de la rama main." >> "$GITHUB_STEP_SUMMARY"
